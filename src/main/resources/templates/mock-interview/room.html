<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Live room — Mock Interview')}"></head>
<body class="min-h-screen bg-tumooh-navy text-white font-sans antialiased flex flex-col">
<div class="border-b border-white/10 bg-tumooh-navy/95 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
        <div class="min-w-0">
            <p class="text-xs uppercase tracking-wider text-white/50">Mock interview</p>
            <h1 class="text-lg font-semibold truncate" th:text="${jobTitle}">Job title</h1>
        </div>
        <div id="timer" class="tabular-nums text-3xl sm:text-4xl font-bold text-tumooh-accent transition-colors duration-300 shrink-0" aria-live="polite">0:30</div>
    </div>
</div>

<main class="flex-1 max-w-6xl mx-auto w-full px-4 sm:px-6 py-6 grid lg:grid-cols-5 gap-6">
    <section class="lg:col-span-3 relative rounded-2xl overflow-hidden bg-black aspect-video shadow-soft ring-1 ring-white/10">
        <video id="webcam"
               class="tumooh-webcam w-full h-full object-cover"
               autoplay
               playsinline
               muted
               disablepictureinpicture
               disableremoteplayback
               aria-label="Your camera preview"></video>
        <div id="camera-fallback" class="hidden absolute inset-0 flex items-center justify-center bg-tumooh-navy/90 text-white/70 text-center p-6 text-sm leading-relaxed">
            Allow camera and microphone to start your mock interview.
        </div>
        <div class="absolute bottom-4 left-4 pointer-events-none">
            <span class="inline-flex items-center gap-2 rounded-full bg-red-500/90 px-3 py-1 text-xs text-white/90">
                <span class="h-2 w-2 rounded-full bg-white animate-pulse"></span> Live simulation
            </span>
        </div>
    </section>

    <aside class="lg:col-span-2 flex flex-col rounded-2xl bg-white/5 border border-white/10 p-5 backdrop-blur-sm">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-tumooh-accent">Your question</h2>
        <p class="mt-1 text-xs text-white/50">Answer this question out loud before the timer ends.</p>
        <ol id="question-list" class="mt-4 space-y-4 list-decimal list-inside text-sm leading-relaxed text-white/90">
            <li th:each="q : ${questions}" th:text="${q}">Question</li>
        </ol>
        <div id="speech-browser-hint" class="hidden mt-4 rounded-lg border border-amber-400/40 bg-amber-500/10 px-3 py-2 text-xs text-amber-100/90 leading-relaxed"></div>
        <div class="mt-4 flex-1 min-h-0 flex flex-col">
            <p class="text-xs uppercase tracking-wide text-white/40">Live caption</p>
            <p id="live-transcript" class="mt-1 text-xs text-white/60 leading-relaxed max-h-24 overflow-y-auto italic">Listening…</p>
        </div>
    </aside>
</main>

<div id="submitting-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-tumooh-navy/90 backdrop-blur-sm">
    <div class="rounded-2xl bg-white/10 border border-white/20 px-8 py-6 text-center max-w-sm mx-4">
        <p class="text-lg font-semibold text-white">Session complete</p>
        <p class="mt-2 text-sm text-white/70" data-overlay-message>Saving your session and generating AI feedback…</p>
    </div>
</div>

<script th:inline="javascript">
    window.TUMOOH_MOCK_SESSION = {
        sessionId: /*[[${sessionId}]]*/ 0,
        feedbackBasePath: /*[[@{/mock-interview/feedback/}]]*/ '/mock-interview/feedback/',
        durationSeconds: 30
    };
</script>
<script th:src="@{/js/mock-interview-room.js(v=3)}"></script>
</body>
</html>
