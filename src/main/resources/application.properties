spring.application.name=tumooh-platform

spring.config.import=optional:classpath:application-local.properties

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tumooh_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Enable SQL logging
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

# Error Handling Configuration
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

server.port=8080

# Gemini AI Integration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-3.8-flash

# UltraMsg WhatsApp Integration
ultramsg.instance-id=${ULTRAMSG_INSTANCE_ID:}
ultramsg.token=${ULTRAMSG_TOKEN:}
